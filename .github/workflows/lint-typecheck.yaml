# Run lint and type-check on push and PR

name: Lint & TypeCheck

on:
  push:
    branches: ["main", "alpha", "beta"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install all dependencies
        run: npm ci --workspaces --include=dev

      - name: Lint web
        run: npm run lint
        working-directory: web

      - name: Lint app
        run: npm run lint
        working-directory: app

      - name: TypeCheck web and app
        run: npm run typecheck

      - name: Format check
        run: npx prettier --check .
